    language: en
    question: "How much is a Medium Supreme Pizza?"
    context: "Menu item pz_supreme: personal 1790, medium 2890, large 3990."
    tool_results:
      - ok: true
        data: { id: pz_supreme, name: Supreme, prices: { personal: 1790, medium: 2890, large: 3990 } }
    bot_reply: "A Medium Supreme Pizza is LKR 2,890. Would you like to add one to your cart?"
    expected_scores: { groundedness: 5, price_integrity: 5, instruction_adherence: 5, language_match: 5, tone_and_brevity: 5, safety: 5 }

