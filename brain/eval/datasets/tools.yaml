- id: t014
  description: "Valid Family Combo addition updates cart"
  clock: "2026-11-10T18:00:00+05:30"
  setup: {stage: browsing, cart: []}
  turns:
    - user: "Add a Family Combo with large Supreme and medium Veggie Delight"
      tool_call:
        name: "cart.add_combo"
        args:
          combo_id: "cb_family"
          choices:
            large_pizza: "pz_supreme"
            medium_pizza: "pz_veggie"
            side: "sd_garlic_bread"
            beverage: "bv_soft_drink_1500"
  expect:
    tool_calls_include: [{name: "cart.add_combo"}]
    final_state: {stage: building_cart, cart: [{item_id: "cb_family", size: "bundle", qty: 1}]}

- id: t015
  description: "Out-of-area location pin (> 8km) leaves branch unset"
  clock: "2026-11-10T18:00:00+05:30"
  setup:
    stage: collecting_fulfilment
    fulfilment: "delivery"
    cart: [{item_id: "pz_supreme", size: "large", qty: 1}]
  turns:
    - user: "Deliver to Galle (lat 6.0535, lng 80.2210)"
      tool_call: {name: "delivery.set_address", args: {lat: 6.0535, lng: 80.2210}}
  expect:
    final_state: {branch_id: null}
    forbidden_tools: ["order.place_order"]



