  tool_calls:
  - name: order.set_fulfilment
    args:
      mode: delivery
  - name: delivery.set_address
    args:
      address_text: 45 High Level Road, Delkanda
  - name: order.show_summary
    args: {}
  bot_reply: 'Summary: 1x Large Chicken Tikka Pizza (LKR 4,190) from Nugegoda (Zone
    1, free delivery). Total: LKR 4,190. Confirm?'
- user: Confirmed!
  tool_calls:
  - name: order.place_order
    args: {}
    use_summary_hash: true
  bot_reply: 'Confirmed! Order {order_no} is placed for Nugegoda delivery. Total:
    LKR 4,190.'
expected_outcome:
  order_placed: true
  stage: placed
  branch_id: nugegoda
  fulfilment: delivery
  items:
  - item_id: pz_chicken_tikka
    size: large
    qty: 1
