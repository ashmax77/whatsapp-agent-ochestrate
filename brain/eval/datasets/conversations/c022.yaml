  bot_reply: 'Summary: Medium Veggie Pizza (LKR 2,590) for Nugegoda pickup. Shall
    I place it?'
- user: Yes place it!
  tool_calls:
  - name: order.place_order
    args: {}
    use_summary_hash: true
