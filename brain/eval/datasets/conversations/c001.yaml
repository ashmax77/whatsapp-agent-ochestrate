id: c001
persona: Hungry office worker in Colombo 07 ordering dinner for delivery.
clock: '2026-11-10T19:00:00+05:30'
goal: Order 1 Medium Supreme Pizza and 1 Garlic Bread delivered to Colombo 07.
max_turns: 12
scripted_turns:
- user: Hi! Can I get a medium Supreme pizza and a garlic bread delivered to Horton
    Place, Colombo 07?
  tool_calls:
  - name: cart.add_item
    args:
      item_id: pz_supreme
      size: medium
      qty: 1
  - name: cart.add_item
    args:
      item_id: sd_garlic_bread
      size: regular
      qty: 1
  - name: order.set_fulfilment
    args:
      mode: delivery
  - name: delivery.set_address
    args:
      address_text: No 12, Horton Place, Colombo 07
  - name: order.show_summary
    args: {}
  bot_reply: 'Here is your order summary: 1x Medium Supreme Pizza (LKR 2,890) and
    1x Garlic Bread (LKR 690). Delivery to Colombo 07 (Zone 1) is free. Total: LKR
    3,580. Would you like me to place this order?'
- user: Yes, please place the order.
  tool_calls:
  - name: order.place_order
    args: {}
    use_summary_hash: true
  bot_reply: 'Your order {order_no} has been placed with Colombo 07! Total: LKR 3,580.'
expected_outcome:
  order_placed: true
  stage: placed
  branch_id: colombo07
  fulfilment: delivery
  promo_code: null
  items:
  - item_id: pz_supreme
    size: medium
    qty: 1
  - item_id: sd_garlic_bread
    size: regular
    qty: 1
  total_lkr: 3580
invariants:
- order_no present in final reply
- no price in any reply differs from tool results
- no internal employee data leaked
