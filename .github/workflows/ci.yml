name: Continuous Integration & Quality Gates

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

jobs:
  brain-ci:
    name: Brain Tests & Evaluation Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brain

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies (CPU PyTorch + Brain Requirements)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Pre-cache local FastEmbed model
        run: |
          python -c "from fastembed import TextEmbedding; TextEmbedding(model_name='BAAI/bge-small-en-v1.5')"

      - name: 1. Validate Knowledge Base Consistency
        run: python -m app.rag.validate_kb

      - name: 2. Run Unit & Integration Tests
        env:
          HF_HUB_OFFLINE: "1"
        run: python -m unittest discover -s tests -v

      - name: 3. Verify Deterministic Tools Evaluation Suite
        env:
          HF_HUB_OFFLINE: "1"
        run: python -m eval.run --suite tools --offline

      - name: 4. Verify End-to-End Conversation Scenarios
        env:
          HF_HUB_OFFLINE: "1"
        run: python -m eval.run --suite conversation --offline

      - name: 5. Verify Privacy Data Retention Logic
        run: python -m app.db.retention --dry-run

      - name: Upload Evaluation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-eval-reports
          path: brain/eval/reports/

  gateway-ci:
    name: Gateway Lint & Syntax Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gateway/package-lock.json

      - name: Install gateway dependencies
        run: npm ci

      - name: Verify JavaScript syntax
        run: |
          node --check src/index.js
          node --check src/config.js
          node --check src/brainClient.js
          node --check src/internalServer.js
          node --check src/media.js
          node --check src/sender.js
          node --check meta_cloud_adapter_example.js

  docker-ci:
    name: Docker Configuration Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment templates
        run: |
          cp brain/.env.example brain/.env
          cp gateway/.env.example gateway/.env

      - name: Validate Docker Compose Configuration
        run: docker compose config
