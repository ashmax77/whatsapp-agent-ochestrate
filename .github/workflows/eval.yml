name: Evaluation & KB Gates

on:
  pull_request:
    paths:
      - "brain/app/**"
      - "brain/data/**"
      - "brain/eval/**"
      - "brain/prompts/**"
      - "brain/tests/**"
  workflow_dispatch:

jobs:
  offline-eval-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brain

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install brain dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate knowledge base
        run: python -m app.rag.validate_kb

      - name: Run unit and integration tests
        env:
          HF_HUB_OFFLINE: "1"
        run: python -m unittest discover -s tests -v

      - name: Run full offline evaluation suite & baseline check
        env:
          HF_HUB_OFFLINE: "1"
        run: python -m eval.run --suite all --offline

      - name: Upload evaluation report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: brain/eval/reports/

