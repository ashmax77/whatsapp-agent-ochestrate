services:
  brain:
    build:
      context: ./brain
      dockerfile: Dockerfile
    container_name: pizza_brain
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: ./brain/.env
        required: false
    volumes:
      - ./brain/data:/app/data
    depends_on:
      - redis
    networks:
      - pizza_network

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: pizza_gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3001:3001"
    env_file:
      - path: ./gateway/.env
        required: false
    volumes:
      - ./gateway/auth_state:/app/auth_state
    depends_on:
      - brain
    networks:
      - pizza_network

  redis:
    image: redis:7-alpine
    container_name: pizza_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pizza_network

volumes:
  redis_data:

networks:
  pizza_network:
    driver: bridge
